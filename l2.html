<script>

function calculateRelease() {

    const bpm = parseFloat(
        document.getElementById("bpm").value
    );

    if (!bpm || bpm <= 0) {
        return;
    }

    const quarterNote = 60000 / bpm;

    const limiter1 = quarterNote / 4;

    const limiter2 = limiter1 * 1.5;

    const limiter3 = quarterNote / 6;


    document.getElementById("limiter1").textContent =
        Math.round(limiter1);

    document.getElementById("limiter2").textContent =
        Math.round(limiter2);

    document.getElementById("limiter3").textContent =
        Math.round(limiter3);

}

calculateRelease();

</script>
